<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cardGradActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>

    <marker id="arrowLoop" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="1200" fill="url(#bgGrad)" rx="20" />
  <rect x="2" y="2" width="956" height="1196" fill="none" stroke="#1e293b" stroke-width="2" rx="18" />

  <!-- Header Section -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="840" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="420" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">PROJECT 3: EVIDENCE-DRIVEN ITERATIVE AI PROMPTING</text>
    <text x="420" y="66" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">Personal Website Engineering Workflow • Kamran Khan Portfolio 2026</text>
  </g>

  <!-- Downward Flow Connectors -->
  <!-- Line 1 to 2 -->
  <line x1="430" y1="230" x2="430" y2="262" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
  <!-- Line 2 to 3 -->
  <line x1="430" y1="350" x2="430" y2="382" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
  <!-- Line 3 to 4 -->
  <line x1="430" y1="470" x2="430" y2="502" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
  <!-- Line 4 to 5 -->
  <line x1="430" y1="590" x2="430" y2="622" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
  <!-- Line 5 to 6 -->
  <line x1="430" y1="710" x2="430" y2="742" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
  <!-- Line 6 to 7 -->
  <line x1="430" y1="830" x2="430" y2="862" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
  <!-- Line 7 to 8 -->
  <line x1="430" y1="950" x2="430" y2="982" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Loop back from Node 8 to Node 4 (Iterative Refinement Loop) -->
  <path d="M 670 1035 L 790 1035 L 790 545 L 678 545" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowLoop)" />
  
  <g transform="translate(805, 780)">
    <rect x="-10" y="-45" width="130" height="75" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <text x="55" y="-22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">ITERATION LOOP</text>
    <text x="55" y="-4" font-family="'Inter', sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">Review Findings</text>
    <text x="55" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Drive Next Build</text>
  </g>

  <!-- NODE 1: VAGUE IDEA -->
  <g transform="translate(190, 160)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="480" height="70" rx="10" fill="url(#cardGrad1)" stroke="#ef4444" stroke-width="1.8" />
    <circle cx="36" cy="35" r="18" fill="#ef4444" fill-opacity="0.2" />
    <text x="36" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">1</text>
    <text x="75" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">1. VAGUE IDEA</text>
    <text x="75" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Generic website request • "Create a site showing summer camp learning"</text>
  </g>

  <!-- NODE 2: SPECIFIC BRIEF -->
  <g transform="translate(190, 280)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="480" height="70" rx="10" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="36" cy="35" r="18" fill="#f59e0b" fill-opacity="0.2" />
    <text x="36" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">2</text>
    <text x="75" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">2. SPECIFIC BRIEF</text>
    <text x="75" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Goal + Audience + Design Decisions (Tech dark theme, Inter typography)</text>
  </g>

  <!-- NODE 3: FIRST BUILD -->
  <g transform="translate(190, 400)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="480" height="70" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="36" cy="35" r="18" fill="#38bdf8" fill-opacity="0.2" />
    <text x="36" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">3</text>
    <text x="75" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">3. FIRST BUILD</text>
    <text x="75" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Initial website scaffold • Component layout &amp; navigation structure</text>
  </g>

  <!-- NODE 4: HUMAN REVIEW -->
  <g transform="translate(190, 520)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="480" height="70" rx="10" fill="url(#cardGradActive)" stroke="#a855f7" stroke-width="2.2" />
    <circle cx="36" cy="35" r="18" fill="#a855f7" fill-opacity="0.25" />
    <text x="36" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#c084fc" text-anchor="middle">4</text>
    <text x="75" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">4. HUMAN REVIEW</text>
    <text x="75" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">Find what is missing • Identify generic placeholders &amp; unproven claims</text>
  </g>

  <!-- NODE 5: ADD EVIDENCE -->
  <g transform="translate(190, 640)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="480" height="70" rx="10" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.8" />
    <circle cx="36" cy="35" r="18" fill="#10b981" fill-opacity="0.2" />
    <text x="36" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">5</text>
    <text x="75" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">5. ADD EVIDENCE</text>
    <text x="75" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Web Game (Snake) + AI Tools (GPT, Claude, Gemini) + Docs + Certificate</text>
  </g>

  <!-- NODE 6: UPDATE PLAN -->
  <g transform="translate(190, 760)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="480" height="70" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="36" cy="35" r="18" fill="#38bdf8" fill-opacity="0.2" />
    <text x="36" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">6</text>
    <text x="75" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">6. UPDATE PLAN</text>
    <text x="75" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Decide what to change • Architecture, visual evidence, lightbox modal</text>
  </g>

  <!-- NODE 7: IMPROVED BUILD -->
  <g transform="translate(190, 880)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="480" height="70" rx="10" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-width="1.8" />
    <circle cx="36" cy="35" r="18" fill="#06b6d4" fill-opacity="0.2" />
    <text x="36" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#22d3ee" text-anchor="middle">7</text>
    <text x="75" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">7. IMPROVED BUILD</text>
    <text x="75" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Personalized site • Responsive layout, interactive game card, real links</text>
  </g>

  <!-- NODE 8: FINAL REVIEW -->
  <g transform="translate(190, 1000)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="480" height="70" rx="10" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="2.2" />
    <circle cx="36" cy="35" r="18" fill="#10b981" fill-opacity="0.25" />
    <text x="36" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">8</text>
    <text x="75" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#f8fafc">8. FINAL REVIEW</text>
    <text x="75" y="50" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Content + Design + Functionality Verification (Loops back if needed)</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(190, 1105)">
    <rect x="0" y="0" width="480" height="42" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <text x="240" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Context → Better Prompt → Better Output → Human Review → Evidence → Iteration</text>
  </g>
</svg>
