<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Certificate Border & Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)" rx="16" />
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="url(#goldGrad)" stroke-width="3" rx="12" />
  <rect x="40" y="40" width="920" height="620" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4" rx="8" />

  <!-- Corner Ornaments -->
  <path d="M 45 75 L 75 45 L 95 45 L 45 95 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 955 75 L 925 45 L 905 45 L 955 95 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 45 625 L 75 655 L 95 655 L 45 605 Z" fill="url(#goldGrad)" opacity="0.8" />
  <path d="M 955 625 L 925 655 L 905 655 L 955 605 Z" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Watermark Emblem -->
  <circle cx="500" cy="350" r="180" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.05" />
  <polygon points="500,200 550,290 645,305 575,370 595,465 500,415 405,465 425,370 355,305 450,290" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.04" />

  <!-- Header -->
  <text x="500" y="115" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#38bdf8" text-anchor="middle">GOVERNOR SINDH INITIATIVE (GIAIC) SUMMER CAMP</text>
  <text x="500" y="170" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" filter="url(#shadow)">CERTIFICATE OF ACHIEVEMENT</text>
  <text x="500" y="210" font-family="'Inter', system-ui, sans-serif" font-size="16" font-style="italic" fill="#94a3b8" text-anchor="middle">This is officially awarded in recognition of successful examination completion to</text>

  <!-- Recipient Name -->
  <text x="500" y="290" font-family="'Inter', system-ui, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">KAMRAN KHAN</text>
  <line x1="280" y1="315" x2="720" y2="315" stroke="url(#cyanGrad)" stroke-width="2.5" />

  <!-- Description -->
  <text x="500" y="365" font-family="'Inter', system-ui, sans-serif" font-size="17" fill="#cbd5e1" text-anchor="middle">For demonstrating comprehensive practical knowledge and passing the official examination in</text>
  <text x="500" y="405" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="middle">Applied Generative AI, AI Prompting &amp; Python Foundations</text>
  <text x="500" y="445" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">Covering Context Engineering, AI Assistants (ChatGPT, Claude, Gemini), and Iterative Prompt Workflows</text>

  <!-- Gold Seal Stamp -->
  <g transform="translate(500, 530)">
    <circle cx="0" cy="0" r="48" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="43" fill="#0f172a" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2" />
    <polygon points="0,-22 7,-7 22,-5 11,6 14,21 0,13 -14,21 -11,6 -22,-5 -7,-7" fill="url(#goldGrad)" />
    <text x="0" y="28" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1">VERIFIED EXAM</text>
  </g>

  <!-- Footer Signatures & Metadata -->
  <g transform="translate(180, 560)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#64748b" stroke-width="1.5" />
    <text x="100" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="middle">Examination Board</text>
    <text x="100" y="45" font-family="'Inter', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">AI Summer Camp June 2026</text>
  </g>

  <g transform="translate(620, 560)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#64748b" stroke-width="1.5" />
    <text x="100" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#f1f5f9" text-anchor="middle">GIAIC Student Council</text>
    <text x="100" y="45" font-family="'Inter', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Credential ID: GIAIC-SC2026-KK</text>
  </g>

  <text x="500" y="640" font-family="'Inter', sans-serif" font-size="11" fill="#475569" text-anchor="middle">Governor Sindh Initiative for GenAI, Web3 &amp; Metaverse (GIAIC) • Summer Camp Assessment</text>
</svg>
